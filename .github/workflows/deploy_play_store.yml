name: Deploy to Google Play Store & GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: play-store-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build, Sign & Deploy Release (Google Play + GitHub Releases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the legacy `tools` package, which cmdline-tools 16.0 no
          # longer provides: sdkmanager exits 1 and the job dies before Gradle runs.
          packages: platform-tools

      - name: Install Android Platform & Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks
            echo "Decoded release-keystore.jks from secret"
          fi

      - name: Run Unit Tests & Debug Verification
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Build Signed Release App Bundle (.aab)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build Signed Release APK (.apk)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Deploy AAB to Google Play Store (Internal Track)
        if: env.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.mankeu
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Publish Dual Release Assets to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true